appId: network.waterfall.app
productName: Waterfall
directories:
  output: dist
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!.zed/*'
  - '!src/*'
  - '!tmp/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/{bin,genesis}/**/*'
  # Native modules: exclude build artifacts and sources (keep only .node + lib)
  - '!node_modules/better-sqlite3/{deps,src,binding.gyp}/**'
  - '!node_modules/better-sqlite3/build/Release/{obj,.deps}/**'
  - '!node_modules/better-sqlite3/build/**/*.{mk,Makefile}'
  - '!node_modules/bcrypto/{deps,src,binding.gyp,CMakeLists.txt}/**'
  - '!node_modules/bcrypto/build/Release/{obj.target,.deps}/**'
  - '!node_modules/bcrypto/build/**/*.{mk,Makefile}'
buildDependenciesFromSource: true
extraFiles:
  - from: 'resources/bin/${os}/${arch}'
    to: 'Resources/bin'
    filter:
      - '**/*'
  - from: 'resources/genesis'
    to: 'Resources/genesis'
    filter:
      - '**/*'
asarUnpack:
  - node_modules/better-sqlite3
  - node_modules/bcrypto
  - resources/**
win:
  executableName: waterfall
  signtoolOptions:
    certificateSha1: '384bb4405b099e15a1d249a1ec07bf5d06b2ac05'
    signingHashAlgorithms:
      - sha1
      - sha256
    rfc3161TimeStampServer: 'http://timestamp.sectigo.com'
nsis:
  artifactName: ${name}-setup-${version}-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Compression: maximum = smaller size, longer build; ULFO = better DMG compression on macOS 10.11+
compression: maximum
dmg:
  format: ULFO
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.utilities
  identity: 'FUENTE LABS LLC (BR22ZLPXU8)'
  target:
    - dmg
    - zip
  extendInfo:
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  artifactName: ${name}-${version}-${arch}.${ext}
  hardenedRuntime: true
  notarize: true
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  #  url: https://docs.waterfall.network/files/app
  url: https://storage.waterfall.network/app
  #  channel: dev
  channel: beta
#  generateUpdateFilesForAllChannels: true
#  publishAutoUpdates: true
